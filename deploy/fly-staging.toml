# fly-staging.toml - Staging environment configuration
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'just-ingredients-staging'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  HEALTH_PORT = '8080'
  LOG_FORMAT = 'pretty'
  RUST_LOG = 'info,sqlx=warn'
  METRICS_BIND_ALL_INTERFACES = 'true'

# Restart the bot whenever it exits. With the default policy Fly gave up after a few
# failed restarts during a Postgres restart (2026-10-16) and left the bot down for 10 days.
[[restart]]
  policy = 'always'
  processes = ['app']

[checks]
  [checks.health]
    port = 8080
    type = 'http'
    interval = '15s'
    timeout = '2s'
    grace_period = '30s'
    path = '/health/live'

# Staging runs only while a change is tested (stop-staging.yml stops it after a production
# deploy and every night; a deployment starts it): a request must not wake it up
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 0
  enable_ha = false
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '30s'
    method = 'GET'
    path = '/health/live'