name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.99

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libleptonica-dev libtesseract-dev tesseract-ocr

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build
      env:
        SQLX_OFFLINE: true  # Prevent database connections during build

    - name: Run tests
      run: cargo test --lib -- --test-threads=8

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: just-ingredients-binary
        path: target/debug/just-ingredients

  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.99
      with:
        components: clippy, rustfmt

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libleptonica-dev libtesseract-dev tesseract-ocr

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings --allow clippy::expect_used

    - name: Check for unwrap violations
      run: ./scripts/check-unwraps.sh

    - name: Check formatting
      run: cargo fmt --all -- --check

  security:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    # Vulnerability and source checks configured in deny.toml. Replaces cargo-audit and
    # cargo-outdated, which were compiled from source on every run; Dependabot handles updates.
    - name: Check advisories and sources
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check advisories sources
