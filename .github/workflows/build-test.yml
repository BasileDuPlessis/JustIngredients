name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

env:
  # sqlx macros check queries against .sqlx/ instead of a live database at compile time
  SQLX_OFFLINE: true
  # One image per commit of main, deployed as is to staging and then production
  IMAGE: ghcr.io/basileduplessis/justingredients

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.99

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build

    - name: Run tests
      run: cargo test --all-targets

    - name: Run doc tests
      run: cargo test --doc

    # Each database test gets its own database created by #[sqlx::test].
    - name: Run database tests
      run: cargo test --test db_tests -- --include-ignored
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    # Updates through the real handler tree, with a fake Telegram server (teloxide_tests)
    - name: Run handler tests
      run: cargo test --test handler_tests -- --include-ignored
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    # The engine's reads on a real database, two users (specs/tasks/engine-api.md)
    - name: Run engine tests
      run: cargo test --test engine_tests -- --include-ignored
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    # The guard of the doors other than Telegram, over a real socket (specs/tasks/engine-api.md)
    - name: Run door tests
      run: cargo test --test doors_tests -- --include-ignored
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    # The exact text of recipe cards, frozen in tests/golden/cards/ (engine refactor guard)
    - name: Run card golden tests
      run: cargo test --test card_golden_tests -- --include-ignored
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.99
      with:
        components: clippy, rustfmt

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Check for unwrap violations
      run: ./scripts/check-unwraps.sh

    - name: Check formatting
      run: cargo fmt --all -- --check

  security:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    # Vulnerability and source checks configured in deny.toml. Replaces cargo-audit and
    # cargo-outdated, which were compiled from source on every run; Dependabot handles updates.
    - name: Check advisories and sources
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check advisories sources

  image:
    # Built once, after every check passed, and only for main: staging and production deploy
    # this exact image (public package, so Fly pulls it without credentials)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, lint, security]
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Keep the image already pushed for this commit
      # A re-run must not push another image under the same tag: staging ran the first one and
      # production deploys the tag after it (IMP-050). Not found (or unreadable): build it.
      id: existing
      run: |
        if docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" > /dev/null 2>&1; then
          echo "The image of this commit is already pushed: kept as is"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
        else
          echo "pushed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build and push the image
      if: steps.existing.outputs.pushed != 'true'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: deploy/Dockerfile
        push: true
        tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
