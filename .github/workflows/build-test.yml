name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

env:
  # sqlx macros check queries against .sqlx/ instead of a live database at compile time
  SQLX_OFFLINE: true
  # One image per commit of main, deployed as is to staging and then production
  IMAGE: ghcr.io/basileduplessis/justingredients

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.120

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build

    - name: Run tests
      run: cargo test --all-targets

    - name: Run doc tests
      run: cargo test --doc

    # Each database test gets its own database created by #[sqlx::test].
    - name: Run database tests
      run: cargo test --test db_tests -- --include-ignored
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.120
      with:
        components: clippy, rustfmt

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings --allow clippy::expect_used

    - name: Check for unwrap violations
      run: ./scripts/check-unwraps.sh

    - name: Check formatting
      run: cargo fmt --all -- --check

  security:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    # Vulnerability and source checks configured in deny.toml. Replaces cargo-audit and
    # cargo-outdated, which were compiled from source on every run; Dependabot handles updates.
    - name: Check advisories and sources
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check advisories sources

  image:
    # Built once, after every check passed, and only for main: staging and production deploy
    # this exact image (public package, so Fly pulls it without credentials)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, lint, security]
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push the image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: deploy/Dockerfile
        push: true
        tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
