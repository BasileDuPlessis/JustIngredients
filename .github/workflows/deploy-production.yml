name: Deploy to Production

# Manual deployment of main's head commit. The commit must have passed Build and Test on a
# push and been deployed to staging successfully first. Production runs the very image staging
# ran (built once by Build and Test); if it does not come up healthy (live, and ready: database
# and a first successful Telegram call), the image and configuration that were running before
# are deployed again.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: production
    env:
      # Deploy token of the production app only (environment secret)
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: just-ingredients
      IMAGE: ghcr.io/basileduplessis/justingredients
      PRODUCTION_URL: https://just-ingredients.fly.dev
    steps:
    # Staging runs are matched on their run name, which carries the deployed commit: the
    # run's own head SHA is the default-branch head when it started, not the tested commit.
    - name: Require green CI and a successful staging deployment of this commit
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Build and Test" --event push \
          --commit "$GITHUB_SHA" --status success --limit 1 --json conclusion --jq 'length')
        if [ "$ci" != "1" ]; then
          echo "::error::Commit $GITHUB_SHA has no successful Build and Test run on push."
          exit 1
        fi
        staging=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Deploy to Staging" \
          --status success --limit 50 --json displayTitle \
          --jq "map(select(.displayTitle == \"Deploy to Staging $GITHUB_SHA\")) | length")
        if [ "$staging" = "0" ]; then
          echo "::error::Commit $GITHUB_SHA has no successful staging deployment. Deploy it to staging first."
          exit 1
        fi

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup flyctl
      uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

    - name: Remember the running release for a rollback
      id: previous
      # Image digest of the running machine and the deployed configuration (not the one of this
      # commit, which may be what breaks). Never blocks the deploy: without them there is just
      # no rollback.
      run: |
        image=$(flyctl machines list --app "$APP" --json \
          | jq -r '([.[] | select(.state == "started")] + .)[0].image_ref
                   | "\(.registry)/\(.repository)@\(.digest)"') || image=""
        case "$image" in
          */*@sha256:*) echo "Running image: $image" ;;
          *) echo "::warning::Could not read the running image: no automatic rollback"; image="" ;;
        esac
        if [ -n "$image" ] && ! flyctl config save --app "$APP" --config "$RUNNER_TEMP/previous-fly.toml" --yes > /dev/null; then
          echo "::warning::Could not save the running configuration: no automatic rollback"
          image=""
        fi
        echo "image=$image" >> "$GITHUB_OUTPUT"

    - name: Deploy the image tested on staging
      run: flyctl deploy --ha=false --config deploy/fly.toml --app "$APP" --image "$IMAGE:sha-$GITHUB_SHA"

    - name: Post-deployment validation
      run: ./scripts/check-health.sh "$PRODUCTION_URL"

    - name: Roll back to the previous image
      id: rollback
      if: failure() && steps.previous.outputs.image != ''
      env:
        PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
      run: |
        flyctl deploy --ha=false --config "$RUNNER_TEMP/previous-fly.toml" --app "$APP" --image "$PREVIOUS_IMAGE"
        ./scripts/check-health.sh "$PRODUCTION_URL"

    - name: Notify deployment result
      if: always()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        JOB_STATUS: ${{ job.status }}
        ROLLBACK: ${{ steps.rollback.outcome }}
      run: |
        run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        if [ "$JOB_STATUS" = "success" ]; then
          text="✅ JustIngredients ${GITHUB_SHA::7} deployed to production."
        elif [ "$ROLLBACK" = "success" ]; then
          text="⚠️ JustIngredients ${GITHUB_SHA::7} failed in production; the previous image is back: $run_url"
        else
          text="❌ JustIngredients ${GITHUB_SHA::7} production deployment failed: $run_url"
        fi
        curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
          --data-urlencode "text=${text}" > /dev/null
