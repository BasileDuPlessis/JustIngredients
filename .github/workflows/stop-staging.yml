name: Stop Staging

# Staging runs only while a change is tested: its bot and its database are stopped once the
# change is in production, and every night in case none was released (stopped machines cost
# almost nothing; 2026-11-02, the user's Fly bill). "Deploy to Staging" starts them again: a push
# to main, or `gh workflow run "Deploy to Staging" --ref main` to try main again.
on:
  workflow_run:
    workflows: ["Deploy to Production"]
    types: [completed]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Reads the last staging deployment (the nightly run skips a test in progress)
  actions: read

# The group of the staging deployments: never stopped in the middle of one
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  STAGING_APP: just-ingredients-staging
  STAGING_DB_APP: just-ingredients-staging-db

jobs:
  stop-staging:
    # After a production run, only once it succeeded (a failed one may be retried soon)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: staging
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_DB_TOKEN: ${{ secrets.FLY_STAGING_DB_TOKEN }}
    steps:
    - name: Skip the nightly stop during a test
      # GitHub can start a scheduled run hours late: on 2026-11-05 the 02:00 run started at
      # 08:51 and stopped a staging deployed 12 minutes earlier, during the user's test. The
      # nightly stop leaves a staging deployed less than 3 hours ago; the next night stops it.
      id: recent
      if: github.event_name == 'schedule'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Deploy to Staging" \
          --status success --limit 1 --json updatedAt --jq '.[0].updatedAt // empty')
        if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt 10800 ]; then
          echo "::notice::Staging was deployed at $last, less than 3 hours ago: left running"
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup flyctl
      if: steps.recent.outputs.skip != 'true'
      uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

    - name: Stop the staging bot
      if: steps.recent.outputs.skip != 'true'
      # `machine stop` returns once the signal is sent: wait until the bot has stopped, so that
      # its last writes (usage, the dialogue heartbeat) find the database still running
      run: |
        for id in $(flyctl machine list --app "$STAGING_APP" --quiet); do
          flyctl machine stop "$id" --app "$STAGING_APP"
          flyctl machine wait "$id" --app "$STAGING_APP" --state stopped --wait-timeout 60s \
            || echo "::warning::The staging bot $id did not report stopped within 60 s"
        done

    - name: Stop the staging database
      if: steps.recent.outputs.skip != 'true' && env.FLY_DB_TOKEN != ''
      run: |
        for id in $(FLY_API_TOKEN="$FLY_DB_TOKEN" flyctl machine list --app "$STAGING_DB_APP" --quiet); do
          FLY_API_TOKEN="$FLY_DB_TOKEN" flyctl machine stop "$id" --app "$STAGING_DB_APP"
        done
