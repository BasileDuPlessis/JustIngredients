name: Deploy to Staging
# The deployed commit is part of the run name: the production gate matches on it.
run-name: Deploy to Staging ${{ github.event.workflow_run.head_sha || github.sha }}

# Runs only after "Build and Test" succeeded for a push to main of this repository, and
# deploys the image that run built for the tested commit. Pull requests (including from forks)
# never deploy.
#
# Staging is a permanent app with its own database and the test bot, created once by hand (see
# specs/deployment.md), not by this workflow. It runs only while a change is tested: this
# workflow starts its database and its bot, "Stop Staging" stops both after a production deploy
# and every night (stopped machines cost almost nothing).
on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  STAGING_APP: just-ingredients-staging
  STAGING_DB_APP: just-ingredients-staging-db
  IMAGE: ghcr.io/basileduplessis/justingredients
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy-staging:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: staging
    env:
      # Deploy token of the staging app only (environment secret)
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Deploy token of the staging database app (environment secret); without it the
      # database is left as it is
      FLY_DB_TOKEN: ${{ secrets.FLY_STAGING_DB_TOKEN }}
    steps:
    - name: Checkout tested commit
      uses: actions/checkout@v7
      with:
        ref: ${{ env.DEPLOY_SHA }}

    - name: Setup flyctl
      uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

    # Stopped by "Stop Staging" when no change is being tested; the bot retries until it answers
    - name: Start the staging database
      if: env.FLY_DB_TOKEN != ''
      run: |
        for id in $(FLY_API_TOKEN="$FLY_DB_TOKEN" flyctl machine list --app "$STAGING_DB_APP" --quiet); do
          FLY_API_TOKEN="$FLY_DB_TOKEN" flyctl machine start "$id" --app "$STAGING_DB_APP" || true
        done
        sleep 15

    # One machine only: two bots polling the same token steal each other's updates
    # (Fly creates two machines on the first deploy of an app unless told otherwise)
    - name: Deploy the tested image
      run: |
        flyctl deploy --ha=false --config deploy/fly-staging.toml --app "$STAGING_APP" \
          --image "$IMAGE:sha-$DEPLOY_SHA"

    # A stopped machine keeps its new image but stays stopped after a deploy, and staging does
    # not start on a request (auto_start_machines = false): start it and wait for it to answer
    - name: Start the staging bot
      run: |
        for id in $(flyctl machine list --app "$STAGING_APP" --quiet); do
          flyctl machine start "$id" --app "$STAGING_APP" || true
        done
        for attempt in $(seq 1 12); do
          if curl -fsS -m 5 -o /dev/null https://just-ingredients-staging.fly.dev/health/live; then
            echo "Staging answers"
            exit 0
          fi
          sleep 5
        done
        echo "::error::Staging does not answer after its start"
        exit 1

  smoke-tests:
    needs: deploy-staging
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: staging
    steps:
    - name: Checkout tested commit
      uses: actions/checkout@v7
      with:
        ref: ${{ env.DEPLOY_SHA }}

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm install

    - name: Run smoke tests
      run: npm run smoke-test
      env:
        STAGING_URL: https://just-ingredients-staging.fly.dev
