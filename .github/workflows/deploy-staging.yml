name: Deploy to Staging
# The deployed commit is part of the run name: the production gate matches on it.
run-name: Deploy to Staging ${{ github.event.workflow_run.head_sha || github.sha }}

# Runs only after "Build and Test" succeeded for a push to main of this repository, and
# deploys the image that run built for the tested commit. Pull requests (including from forks)
# never deploy.
#
# Staging is a permanent app with its own database and the test bot: it keeps running between
# deployments, so the test bot can be used to try a change before production. It is created
# once by hand (see specs/deployment.md), not by this workflow.
on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  STAGING_APP: just-ingredients-staging
  IMAGE: ghcr.io/basileduplessis/justingredients
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy-staging:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: staging
    env:
      # Deploy token of the staging app only (environment secret)
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
    - name: Checkout tested commit
      uses: actions/checkout@v4
      with:
        ref: ${{ env.DEPLOY_SHA }}

    - name: Setup flyctl
      uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

    # One machine only: two bots polling the same token steal each other's updates
    # (Fly creates two machines on the first deploy of an app unless told otherwise)
    - name: Deploy the tested image
      run: |
        flyctl deploy --ha=false --config deploy/fly-staging.toml --app "$STAGING_APP" \
          --image "$IMAGE:sha-$DEPLOY_SHA"

  smoke-tests:
    needs: deploy-staging
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: staging
    steps:
    - name: Checkout tested commit
      uses: actions/checkout@v4
      with:
        ref: ${{ env.DEPLOY_SHA }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm install

    - name: Run smoke tests
      run: npm run smoke-test
      env:
        STAGING_URL: https://just-ingredients-staging.fly.dev
