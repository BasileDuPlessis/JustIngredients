version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The bot gives teloxide its own reqwest client: reqwest moves when teloxide does
      # (teloxide 0.17 needs reqwest 0.12; #7 failed with 0.13)
      - dependency-name: reqwest
        versions: [">= 0.13"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # Its "version" is the Rust release, kept with rust-toolchain.toml and the Dockerfile;
      # Dependabot read @1.99 as a version and proposed a Rust 1.120 that does not exist (#11)
      - dependency-name: dtolnay/rust-toolchain
