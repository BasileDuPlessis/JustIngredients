[package]
name = "just-ingredients"
version = "0.1.0"
edition = "2021"
# The toolchain of rust-toolchain.toml, deploy/Dockerfile and CI: bump them together
rust-version = "1.99"
license = "MIT"

[dependencies]
# rustls only (IMP-034): no OpenSSL in the binary nor in the image
teloxide = { version = "0.17.0", default-features = false, features = ["ctrlc_handler", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
sqlx = { version = "0.8", features = [ "postgres", "runtime-tokio-rustls", "chrono" ] }
tokio = { version = "1.48.0", features = ["full"] }
dotenvy = "0.15"
anyhow = "1.0.100"
thiserror = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "system-proxy"] }
base64 = "0.23" # Image encoding for the Gemini API
bytes = "1" # Request body shared between retries without copying
sha2 = "0.10" # Image fingerprints for the extraction cache
image = "0.25"    # For image handling if needed
rand = "0.9.2" # For random jitter in retry delays
fluent-bundle = "0.16" # Fluent bundle for message management
unic-langid = "0.9" # Language identifier support
regex = "1.12" # Regular expressions for text processing
chrono = { version = "0.4.42", features = ["serde"] } # DateTime handling
tracing = "0.1" # Structured logging
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] } # Tracing subscriber with filtering

# Observability dependencies
metrics = "0.24" # Metrics collection
metrics-exporter-prometheus = { version = "0.18", default-features = false } # Renders /metrics (served by our own server)
hyper = { version = "1.0", features = ["server", "http1"] } # Health and metrics servers
hyper-util = { version = "0.1.17", features = ["tokio"] } # Hyper utilities

# Training data generation dependencies
# (Removed - training binaries deleted)

[dev-dependencies]
tempfile = "3.23.0" # Temporary files in tests
wiremock = "0.6" # HTTP mock server for the Gemini client tests
metrics-util = { version = "0.20", features = ["debugging"] } # In-process recorder for metric tests
teloxide_tests = "0.4" # A fake Telegram server: updates through the real handler tree (IMP-031)
# A few clippy lints beyond the defaults (IMP-038), for every target; CI's `-D warnings` makes
# them errors. The no-panic and no-wrapping-cast rules are in lib.rs and main.rs (not tests).
[lints.clippy]
ref_option = "warn"
unused_async = "warn"
redundant_clone = "warn"
