# cargo-deny configuration, run in CI by EmbarkStudios/cargo-deny-action.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Vulnerabilities always fail. Unmaintained crates fail only when they are direct
# dependencies; transitive ones (paste, proc-macro-error2) are tracked upstream.
unmaintained = "workspace"
ignore = [
    # h2 0.3 comes only through actix-http, the fake Telegram server of teloxide_tests, a
    # dev-dependency run by the handler tests on localhost; the bot itself uses h2 0.4 (fixed).
    { id = "RUSTSEC-2026-0258", reason = "dev-only: the tests' fake Telegram server on localhost" },
    # libsqlite3-sys 0.30 (bundled SQLite before 3.54) comes only through teloxide_tests, which
    # turns on teloxide's sqlite storage: the release build has no SQLite (`cargo tree -e no-dev
    # -i libsqlite3-sys` prints nothing), and no SQLite file is ever opened. sqlx 0.8 pins 0.30;
    # the fix is 0.39. Drop this line when sqlx or teloxide_tests move on.
    { id = "RUSTSEC-2026-0459", reason = "dev-only: SQLite through teloxide_tests, never opened" },
    # chrono is unmaintained (no vulnerability, no fixed version): sqlx, teloxide and rmcp use it
    # too, so leaving it waits for them; jiff is the advised replacement. Revisit when they move.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, not vulnerable; sqlx, teloxide, rmcp use it" },
    # cookie 0.16 (private cookies' nonces repeated across fork(); fixed in 0.18.3) comes only
    # through actix-web, the fake Telegram server of teloxide_tests: the release build has no
    # cookie crate (`cargo tree -e no-dev -i cookie` finds nothing), the tests never fork nor
    # seal private cookies. Drop this line when teloxide_tests moves on.
    { id = "RUSTSEC-2026-0594", reason = "dev-only: the tests' fake Telegram server, no private cookies" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
